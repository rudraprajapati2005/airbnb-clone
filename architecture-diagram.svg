<svg viewBox="0 0 1440 980" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1440" height="980" fill="#ffffff" />

  <text x="40" y="42" font-size="22" font-weight="700" fill="#111111">Production Architecture — Vacation Rental Marketplace</text>
  <text x="40" y="66" font-size="13" fill="#666666">Request flow, persistent storage, caching, search, media, async processing, and observability</text>

  <!-- Client -->
  <g>
    <rect x="40" y="110" width="150" height="64" rx="10" fill="#fdeef1" stroke="#ff385c" stroke-width="1.5" />
    <text x="115" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Client</text>
    <text x="115" y="154" font-size="11" text-anchor="middle" fill="#555">Web / Mobile app</text>
  </g>

  <!-- CDN/Edge -->
  <g>
    <rect x="240" y="110" width="150" height="64" rx="10" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5" />
    <text x="315" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#111">CDN / Edge</text>
    <text x="315" y="154" font-size="11" text-anchor="middle" fill="#555">Static assets, TLS, WAF</text>
  </g>

  <!-- Frontend -->
  <g>
    <rect x="440" y="110" width="160" height="64" rx="10" fill="#eef4ff" stroke="#3b6fd1" stroke-width="1.5" />
    <text x="520" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Frontend</text>
    <text x="520" y="154" font-size="11" text-anchor="middle" fill="#555">SSR/CSR app (React/Next)</text>
  </g>

  <!-- API Gateway -->
  <g>
    <rect x="650" y="110" width="180" height="64" rx="10" fill="#f2eefb" stroke="#7a4fd6" stroke-width="1.5" />
    <text x="740" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#111">API Gateway / LB</text>
    <text x="740" y="154" font-size="11" text-anchor="middle" fill="#555">Routing, rate limiting, auth check</text>
  </g>

  <!-- Auth service (separate call-out) -->
  <g>
    <rect x="900" y="110" width="150" height="64" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" />
    <text x="975" y="136" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Auth Service</text>
    <text x="975" y="154" font-size="11" text-anchor="middle" fill="#555">Identity, tokens, sessions</text>
  </g>

  <!-- Arrows: client -> cdn -> frontend -> gateway -> auth -->
  <line x1="190" y1="142" x2="238" y2="142" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="390" y1="142" x2="438" y2="142" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="142" x2="648" y2="142" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="830" y1="142" x2="898" y2="142" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Backend services row -->
  <text x="40" y="230" font-size="13" font-weight="700" fill="#111">Backend services</text>
  <g>
    <rect x="40" y="248" width="170" height="70" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" />
    <text x="125" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Listing Service</text>
    <text x="125" y="296" font-size="11" text-anchor="middle" fill="#555">CRUD, availability calendar</text>
  </g>
  <g>
    <rect x="235" y="248" width="170" height="70" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" />
    <text x="320" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Booking Service</text>
    <text x="320" y="296" font-size="11" text-anchor="middle" fill="#555">Reservations, holds, pricing</text>
  </g>
  <g>
    <rect x="430" y="248" width="170" height="70" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" />
    <text x="515" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Search Service</text>
    <text x="515" y="296" font-size="11" text-anchor="middle" fill="#555">Query, ranking, geo filters</text>
  </g>
  <g>
    <rect x="625" y="248" width="170" height="70" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" />
    <text x="710" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Payment Service</text>
    <text x="710" y="296" font-size="11" text-anchor="middle" fill="#555">Charges, payouts, ledger</text>
  </g>
  <g>
    <rect x="820" y="248" width="170" height="70" rx="10" fill="#fff7e6" stroke="#c98a12" stroke-width="1.5" />
    <text x="905" y="278" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Media Service</text>
    <text x="905" y="296" font-size="11" text-anchor="middle" fill="#555">Upload, transcode, moderation</text>
  </g>

  <!-- Gateway to services -->
  <line x1="740" y1="174" x2="740" y2="205" stroke="#4a4a4a" stroke-width="1.5" />
  <line x1="125" y1="205" x2="740" y2="205" stroke="#4a4a4a" stroke-width="1.5" />
  <line x1="125" y1="205" x2="125" y2="246" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="320" y1="205" x2="320" y2="246" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="515" y1="205" x2="515" y2="246" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="710" y1="205" x2="710" y2="246" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="905" y1="205" x2="905" y2="205" stroke="#4a4a4a" stroke-width="1.5" />
  <line x1="740" y1="205" x2="905" y2="205" stroke="#4a4a4a" stroke-width="1.5" />
  <line x1="905" y1="205" x2="905" y2="246" stroke="#4a4a4a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Data layer -->
  <text x="40" y="368" font-size="13" font-weight="700" fill="#111">Data &amp; storage layer</text>
  <g>
    <rect x="40" y="386" width="190" height="72" rx="10" fill="#eafbf1" stroke="#1f9d55" stroke-width="1.5" />
    <text x="135" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Relational DB</text>
    <text x="135" y="432" font-size="11" text-anchor="middle" fill="#555">Postgres, primary + read replicas</text>
    <text x="135" y="448" font-size="11" text-anchor="middle" fill="#555">sharded by region</text>
  </g>
  <g>
    <rect x="255" y="386" width="170" height="72" rx="10" fill="#eafbf1" stroke="#1f9d55" stroke-width="1.5" />
    <text x="340" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Cache</text>
    <text x="340" y="432" font-size="11" text-anchor="middle" fill="#555">Redis: sessions, hot listings,</text>
    <text x="340" y="448" font-size="11" text-anchor="middle" fill="#555">availability lookups</text>
  </g>
  <g>
    <rect x="450" y="386" width="190" height="72" rx="10" fill="#eafbf1" stroke="#1f9d55" stroke-width="1.5" />
    <text x="545" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Search Index</text>
    <text x="545" y="432" font-size="11" text-anchor="middle" fill="#555">OpenSearch/Elasticsearch,</text>
    <text x="545" y="448" font-size="11" text-anchor="middle" fill="#555">kept in sync via events</text>
  </g>
  <g>
    <rect x="665" y="386" width="190" height="72" rx="10" fill="#eafbf1" stroke="#1f9d55" stroke-width="1.5" />
    <text x="760" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Object Storage</text>
    <text x="760" y="432" font-size="11" text-anchor="middle" fill="#555">S3-compatible: listing photos,</text>
    <text x="760" y="448" font-size="11" text-anchor="middle" fill="#555">documents, backups</text>
  </g>
  <g>
    <rect x="880" y="386" width="150" height="72" rx="10" fill="#eafbf1" stroke="#1f9d55" stroke-width="1.5" />
    <text x="955" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Ledger DB</text>
    <text x="955" y="432" font-size="11" text-anchor="middle" fill="#555">Append-only store for</text>
    <text x="955" y="448" font-size="11" text-anchor="middle" fill="#555">payment/payout records</text>
  </g>

  <!-- service -> data connections -->
  <line x1="125" y1="318" x2="135" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="320" y1="318" x2="340" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="320" y1="318" x2="135" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="515" y1="318" x2="545" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="905" y1="318" x2="760" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="710" y1="318" x2="955" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- media -> CDN loop back -->
  <path d="M 905 386 C 950 300 700 60 400 108" fill="none" stroke="#3b6fd1" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="1000" y="345" font-size="10" fill="#3b6fd1">media served back through CDN</text>

  <!-- Async / events -->
  <text x="1060" y="368" font-size="13" font-weight="700" fill="#111">Async processing</text>
  <g>
    <rect x="1060" y="386" width="170" height="72" rx="10" fill="#fdeef1" stroke="#ff385c" stroke-width="1.5" />
    <text x="1145" y="414" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Event Queue</text>
    <text x="1145" y="432" font-size="11" text-anchor="middle" fill="#555">Kafka/SQS: booking, payment,</text>
    <text x="1145" y="448" font-size="11" text-anchor="middle" fill="#555">listing-changed events</text>
  </g>
  <line x1="1030" y1="422" x2="1058" y2="422" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />
  <line x1="855" y1="318" x2="1145" y2="384" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />

  <g>
    <rect x="1060" y="490" width="170" height="70" rx="10" fill="#fdeef1" stroke="#ff385c" stroke-width="1.5" />
    <text x="1145" y="518" font-size="13" font-weight="700" text-anchor="middle" fill="#111">Notification Service</text>
    <text x="1145" y="536" font-size="11" text-anchor="middle" fill="#555">Email / SMS / push, templated</text>
  </g>
  <line x1="1145" y1="458" x2="1145" y2="488" stroke="#4a4a4a" stroke-width="1.3" marker-end="url(#arrow)" />

  <!-- search index sync arrow from queue -->
  <path d="M 1060 405 C 800 200 600 200 545 384" fill="none" stroke="#ff385c" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <text x="760" y="200" font-size="10" fill="#ff385c">index refresh via events</text>

  <!-- Cross-cutting: Observability -->
  <g>
    <rect x="40" y="600" width="1190" height="80" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.2" />
    <text x="60" y="626" font-size="13" font-weight="700" fill="#111">Observability (cross-cutting)</text>
    <text x="60" y="646" font-size="11" fill="#555">Centralized structured logs, metrics (RED/USE), distributed tracing across gateway and services,</text>
    <text x="60" y="662" font-size="11" fill="#555">uptime checks, and alerting; every service above emits to this layer.</text>
  </g>

  <!-- Deployment infra -->
  <g>
    <rect x="40" y="700" width="1190" height="90" rx="10" fill="#f4f4f4" stroke="#8a8a8a" stroke-width="1.2" />
    <text x="60" y="726" font-size="13" font-weight="700" fill="#111">Deployment &amp; scaling</text>
    <text x="60" y="746" font-size="11" fill="#555">Containerized services on Kubernetes (or ECS), horizontal autoscaling per service, blue/green or</text>
    <text x="60" y="764" font-size="11" fill="#555">canary rollouts via CI/CD, infrastructure as code, and multi-AZ / multi-region deployment for resilience.</text>
    <text x="60" y="782" font-size="11" fill="#555">Database layer scales via read replicas and regional sharding; cache and search index scale independently.</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="40" y="820" width="14" height="14" fill="#fdeef1" stroke="#ff385c" />
    <text x="62" y="832" font-size="11" fill="#333">Edge / client-facing</text>

    <rect x="220" y="820" width="14" height="14" fill="#eef4ff" stroke="#3b6fd1" />
    <text x="242" y="832" font-size="11" fill="#333">Frontend / routing</text>

    <rect x="400" y="820" width="14" height="14" fill="#fff7e6" stroke="#c98a12" />
    <text x="422" y="832" font-size="11" fill="#333">Backend services</text>

    <rect x="580" y="820" width="14" height="14" fill="#eafbf1" stroke="#1f9d55" />
    <text x="602" y="832" font-size="11" fill="#333">Persistent storage</text>

    <rect x="760" y="820" width="14" height="14" fill="#f4f4f4" stroke="#8a8a8a" />
    <text x="782" y="832" font-size="11" fill="#333">Cross-cutting infra</text>
  </g>

  <text x="40" y="900" font-size="11" fill="#888">
    Solid arrows: synchronous request path. Dashed arrows: asynchronous / eventual-consistency paths (index refresh, media distribution).
  </text>
  <text x="40" y="920" font-size="11" fill="#888">
    Scope note: this diagram illustrates the scaling strategy the take-home assignment asks for; the demo app itself ships as a static frontend only.
  </text>
</svg>
